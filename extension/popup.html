<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERITAS</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">

    <!-- Hero Section: Always Visible -->
    <header class="hero">
      <h1 class="brand">Veritas</h1>
      <p class="tagline" data-i18n="tagline">News Credibility Analyzer</p>
      <div style="position: absolute; top: 0; right: 0; display:flex; gap:8px;">
        <button id="viewParsedTextBtn" title="View Parsed Text & Tests" class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </button>
        <button id="settingsBtn" title="Settings" class="btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- State: Initial (Show Analyze Button) -->
    <section class="state-initial" id="stateInitial">
      <div class="hero-score hero-score--empty">
        <span class="score-placeholder">?</span>
      </div>
      <button class="btn-primary" id="analyzeBtn" data-i18n="analyze_article">Analyze This Article</button>
      <p class="hint" data-i18n="hint_click">Click to assess article credibility</p>
    </section>

    <!-- State: Analyzing -->
    <section class="state-analyzing hidden" id="stateAnalyzing">
      <div class="hero-score hero-score--loading">
        <div class="spinner"></div>
      </div>
      <p class="status-text" id="statusText" data-i18n="extracting_content">Extracting content...</p>
      <div class="progress-dots">
        <span class="dot active" id="dot1"></span>
        <span class="dot" id="dot2"></span>
        <span class="dot" id="dot3"></span>
      </div>
      <button class="btn-secondary" id="resetBtn" style="margin-top: 15px;" data-i18n="cancel">Cancel</button>
    </section>

    <!-- State: Results -->
    <section class="state-results hidden" id="stateResults">
      <!-- Hero Score Circle with SVG Ring -->
      <div class="hero-score-wrapper" id="heroScoreWrapper">
        <svg class="score-ring" viewBox="0 0 140 140" width="140" height="140">
          <circle class="score-ring__track" cx="70" cy="70" r="62" fill="none" stroke-width="6"/>
          <circle class="score-ring__fill" id="scoreRingFill" cx="70" cy="70" r="62" fill="none" stroke-width="6"
            stroke-linecap="round" transform="rotate(-90 70 70)"/>
        </svg>
        <div class="hero-score-content" id="heroScore">
          <span class="score-value" id="scoreValue">--</span>
          <span class="score-label" data-i18n="trust_score">Trust Score</span>
        </div>
      </div>

      <!-- Toggle for Details -->
      <button class="btn-link" id="toggleDetails" data-i18n="view_breakdown">View Detailed Breakdown</button>

      <!-- Highlight Navigator -->
      <div class="highlight-navigator hidden" id="highlightNavigator">
        <p class="navigator-title" data-i18n="found_issues">Found Issues</p>
        <div class="highlight-badges">
          <button class="highlight-badge highlight-badge--warning" id="badgeWarnings">
            <span class="badge-count" id="warningCount">0</span>
            <span class="badge-label" data-i18n="warnings">Warnings</span>
          </button>
          <button class="highlight-badge highlight-badge--risk" id="badgeRisks">
            <span class="badge-count" id="riskCount">0</span>
            <span class="badge-label" data-i18n="high_risk">High Risk</span>
          </button>
        </div>
        <div class="highlight-nav-controls hidden" id="navControls">
          <button class="nav-btn" id="prevHighlight">←</button>
          <span class="nav-position" id="navPosition">1 of 5</span>
          <button class="nav-btn" id="nextHighlight">→</button>
        </div>
      </div>

      <!-- Hidden Accordion Section -->
      <div class="details-panel hidden" id="detailsPanel">
        <!-- Radar Chart Container -->
        <div class="radar-chart-container" id="radarChartContainer">
          <!-- SVG radar chart will be injected by JS -->
        </div>

        <div class="metrics-list">
          <div class="metric-row">
            <span class="metric-name" data-i18n="source_verification">Source Verification</span>
            <span class="metric-value" id="metricSource">--</span>
          </div>
          <div class="metric-row">
            <span class="metric-name" data-i18n="objectivity">Objectivity</span>
            <span class="metric-value" id="metricObjectivity">--</span>
          </div>
          <div class="metric-row">
            <span class="metric-name" data-i18n="headline_relevance">Headline Relevance</span>
            <span class="metric-value" id="metricHeadline">--</span>
          </div>
          <div class="metric-row">
            <span class="metric-name" data-i18n="factual_density">Factual Density</span>
            <span class="metric-value" id="metricDensity">--</span>
          </div>
          <div class="metric-row">
            <span class="metric-name" data-i18n="logical_consistency">Logical Consistency</span>
            <span class="metric-value" id="metricLogic">--</span>
          </div>
        </div>

        <!-- Explainer at the bottom -->
        <div class="explainer-section">
          <p class="explainer-text" id="explainerText"></p>
        </div>
      </div>

      <!-- Re-analyze -->
      <button class="btn-secondary" id="reanalyzeBtn" data-i18n="analyze_again">Analyze Again</button>
    </section>

    <!-- State: Error -->
    <section class="state-error hidden" id="stateError">
      <div class="hero-score hero-score--error">
        <span class="error-icon">!</span>
      </div>
      <p class="error-text" id="errorText">An error occurred</p>
      <button class="btn-secondary" id="retryBtn" data-i18n="try_again">Try Again</button>
    </section>

    <!-- State: Settings -->
    <section class="state-settings hidden" id="stateSettings">
      <h2 data-i18n="settings_title" style="margin-bottom: 20px; text-align: center;">Settings</h2>
      
      <div style="margin-bottom: 20px;">
        <label for="languageSelect" data-i18n="language_label" style="display: block; margin-bottom: 8px; font-weight: 600;">App Language</label>
        <select id="languageSelect" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border-accent); background: var(--bg-color);">
          <option value="uk">Українська</option>
          <option value="en">English</option>
        </select>
      </div>

      <button class="btn-secondary" id="backToAnalysisBtn" data-i18n="back_to_analysis">Back to Analysis</button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="connection-indicator">
        <span class="dot-status" id="connectionDot"></span>
        <span class="connection-text" id="connectionText" data-i18n="checking">Checking...</span>
      </div>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>

</html>

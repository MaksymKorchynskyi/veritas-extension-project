<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERITAS — Benchmark Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #242736;
            --border: #2e3244;
            --text: #e4e6f0;
            --text-sec: #8b8fa3;
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.1);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.1);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.1);
            --blue: #3b82f6;
            --blue-bg: rgba(59, 130, 246, 0.1);
            --purple: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: var(--text-sec);
            font-size: 0.9rem;
        }

        .header .dataset-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            background: var(--blue-bg);
            color: var(--blue);
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-green {
            color: var(--green);
        }

        .stat-yellow {
            color: var(--yellow);
        }

        .stat-red {
            color: var(--red);
        }

        .stat-blue {
            color: var(--blue);
        }

        /* Metrics panel */
        .metrics-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .metrics-panel h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .metric-item {
            background: var(--surface2);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Confusion matrix */
        .confusion-matrix {
            display: inline-grid;
            grid-template-columns: auto auto auto;
            gap: 2px;
            margin-top: 16px;
        }

        .cm-cell {
            padding: 12px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 4px;
        }

        .cm-header {
            background: transparent;
            color: var(--text-sec);
            font-size: 0.75rem;
        }

        .cm-tp {
            background: var(--green-bg);
            color: var(--green);
        }

        .cm-fp {
            background: var(--red-bg);
            color: var(--red);
        }

        .cm-fn {
            background: var(--yellow-bg);
            color: var(--yellow);
        }

        .cm-tn {
            background: var(--green-bg);
            color: var(--green);
        }

        /* Category cards */
        .category-section {
            margin-bottom: 24px;
        }

        .cat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .cat-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: white;
        }

        .badge-A {
            background: var(--green);
        }

        .badge-B {
            background: var(--yellow);
        }

        .badge-C {
            background: var(--red);
        }

        .cat-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cat-stats {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--text-sec);
        }

        /* Article rows */
        .article-row {
            display: grid;
            grid-template-columns: 50px 1fr 80px 80px 80px 80px 50px;
            gap: 8px;
            align-items: center;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 0.82rem;
            transition: all 0.15s;
        }

        .article-row:hover {
            background: var(--surface2);
            border-color: var(--blue);
        }

        .article-id {
            font-weight: 700;
            color: var(--text-sec);
        }

        .article-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .score-cell {
            text-align: center;
            font-weight: 700;
        }

        .match-cell {
            text-align: center;
            font-size: 1.1rem;
        }

        .score-bar {
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            margin-top: 4px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 2px;
        }

        /* Table header */
        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 80px 80px 80px 80px 50px;
            gap: 8px;
            padding: 8px 16px;
            font-size: 0.7rem;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .load-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-sec);
        }

        .empty-state p {
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-sec);
            font-size: 0.7rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>VERITAS Benchmark</h1>
            <p class="subtitle">Algorithm Performance Dashboard</p>
            <span class="dataset-badge">ISOT Fake News Dataset · Ahmed et al. 2018 · 50 Articles</span>
        </div>

        <div>
            <label class="load-btn" for="jsonInput">📂 Load latest_results.json</label>
            <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="loadJSON(event)">
        </div>

        <div id="dashboard" class="empty-state">
            <p style="font-size:2rem">📊</p>
            <p>Load <code>latest_results.json</code> from <code>backend/tests/results/</code></p>
        </div>

        <div class="footer">
            VERITAS Benchmark Dashboard · ISOT Dataset · Курсова робота
        </div>
    </div>

    <script>
        function loadJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    renderDashboard(data);
                } catch (err) {
                    alert('Error parsing JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function getScoreColor(score) {
            if (score >= 60) return 'var(--green)';
            if (score >= 30) return 'var(--yellow)';
            return 'var(--red)';
        }

        function renderDashboard(results) {
            const ok = results.filter(r => r.status === 'OK');
            if (!ok.length) { document.getElementById('dashboard').innerHTML = '<p>No valid results found</p>'; return; }

            const total = ok.length;
            const correct = ok.filter(r => r.in_range === '✅').length;
            const avgScore = (ok.reduce((s, r) => s + r.trust_score, 0) / total).toFixed(1);
            const avgTime = (ok.reduce((s, r) => s + (r.elapsed_s || 0), 0) / total).toFixed(1);

            // Classification metrics (threshold = 40)
            const THRESHOLD = 40;
            const tp = ok.filter(r => ['B', 'C'].includes(r.category) && r.trust_score < THRESHOLD).length;
            const fp = ok.filter(r => r.category === 'A' && r.trust_score < THRESHOLD).length;
            const tn = ok.filter(r => r.category === 'A' && r.trust_score >= THRESHOLD).length;
            const fn = ok.filter(r => ['B', 'C'].includes(r.category) && r.trust_score >= THRESHOLD).length;
            const precision = tp / Math.max(1, tp + fp);
            const recall = tp / Math.max(1, tp + fn);
            const f1 = 2 * precision * recall / Math.max(0.001, precision + recall);
            const accuracy = (tp + tn) / total;

            // Category stats
            const cats = {};
            ok.forEach(r => {
                if (!cats[r.category]) cats[r.category] = { scores: [], correct: 0, total: 0 };
                cats[r.category].scores.push(r.trust_score);
                cats[r.category].total++;
                if (r.in_range === '✅') cats[r.category].correct++;
            });

            let html = '';

            // Stats cards
            html += `<div class="stats-grid">
        <div class="stat-card"><div class="stat-value stat-blue">${total}</div><div class="stat-label">Articles Tested</div></div>
        <div class="stat-card"><div class="stat-value stat-green">${correct}/${total}</div><div class="stat-label">In Expected Range</div></div>
        <div class="stat-card"><div class="stat-value" style="color:${getScoreColor(avgScore)}">${avgScore}</div><div class="stat-label">Avg Trust Score</div></div>
        <div class="stat-card"><div class="stat-value stat-blue">${avgTime}s</div><div class="stat-label">Avg Response Time</div></div>
    </div>`;

            // Classification metrics
            html += `<div class="metrics-panel">
        <h2>📐 Classification Metrics (threshold = ${THRESHOLD})</h2>
        <div class="metrics-grid">
            <div class="metric-item"><div class="metric-value stat-green">${precision.toFixed(3)}</div><div class="metric-label">Precision</div></div>
            <div class="metric-item"><div class="metric-value stat-green">${recall.toFixed(3)}</div><div class="metric-label">Recall</div></div>
            <div class="metric-item"><div class="metric-value stat-blue">${f1.toFixed(3)}</div><div class="metric-label">F1 Score</div></div>
            <div class="metric-item"><div class="metric-value stat-blue">${accuracy.toFixed(3)}</div><div class="metric-label">Accuracy</div></div>
        </div>
        <div style="margin-top:20px">
            <h3 style="font-size:0.85rem; color:var(--text-sec); margin-bottom:8px;">Confusion Matrix</h3>
            <div class="confusion-matrix">
                <div class="cm-cell cm-header"></div>
                <div class="cm-cell cm-header">Pred: Unreliable</div>
                <div class="cm-cell cm-header">Pred: Reliable</div>
                <div class="cm-cell cm-header">Actual: B+C</div>
                <div class="cm-cell cm-tp">TP = ${tp}</div>
                <div class="cm-cell cm-fn">FN = ${fn}</div>
                <div class="cm-cell cm-header">Actual: A</div>
                <div class="cm-cell cm-fp">FP = ${fp}</div>
                <div class="cm-cell cm-tn">TN = ${tn}</div>
            </div>
        </div>
    </div>`;

            // Category breakdown
            const catMeta = {
                A: { name: 'Quality Journalism (Reuters)', badge: 'badge-A', range: '60–100' },
                B: { name: 'Biased / Low Quality', badge: 'badge-B', range: '25–60' },
                C: { name: 'Manipulative / Fake', badge: 'badge-C', range: '0–30' },
            };

            html += `<div class="table-header">
        <div>ID</div><div>Title</div><div style="text-align:center">Trust</div>
        <div style="text-align:center">Cred</div><div style="text-align:center">Trans</div>
        <div style="text-align:center">Obj</div><div style="text-align:center">✓</div>
    </div>`;

            for (const cat of ['A', 'B', 'C']) {
                const articles = ok.filter(r => r.category === cat);
                if (!articles.length) continue;
                const meta = catMeta[cat];
                const catData = cats[cat];
                const avg = (catData.scores.reduce((a, b) => a + b, 0) / catData.scores.length).toFixed(1);

                html += `<div class="category-section">
            <div class="cat-header">
                <div class="cat-badge ${meta.badge}">${cat}</div>
                <h3>${meta.name}</h3>
                <div class="cat-stats">
                    Avg: ${avg} · Range: ${meta.range} · ${catData.correct}/${catData.total} ✅
                </div>
            </div>`;

                for (const r of articles) {
                    const color = getScoreColor(r.trust_score);
                    html += `<div class="article-row">
                <div class="article-id">${r.id}</div>
                <div class="article-title" title="${r.title}">${r.title}</div>
                <div class="score-cell" style="color:${color}">${r.trust_score}
                    <div class="score-bar"><div class="score-fill" style="width:${r.trust_score}%;background:${color}"></div></div>
                </div>
                <div class="score-cell">${r.credibility?.toFixed(1) ?? '—'}</div>
                <div class="score-cell">${r.transparency?.toFixed(1) ?? '—'}</div>
                <div class="score-cell">${r.objectivity?.toFixed(1) ?? '—'}</div>
                <div class="match-cell">${r.in_range}</div>
            </div>`;
                }
                html += `</div>`;
            }

            document.getElementById('dashboard').innerHTML = html;
            document.getElementById('dashboard').classList.remove('empty-state');
        }
    </script>
</body>

</html>

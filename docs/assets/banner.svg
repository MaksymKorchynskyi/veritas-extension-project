<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Veritas</title>
  <desc id="desc">Veritas: hybrid AI browser extension for news credibility analysis</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M100 0V300M300 0V300M500 0V300M700 0V300M900 0V300M1100 0V300"/>
  </g>

  <g transform="translate(160 150)">
    <path d="M -90 40 A 90 90 0 0 1 90 40" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <path d="M -90 40 A 90 90 0 0 1 90 40" fill="none" stroke="url(#gauge)" stroke-width="18" stroke-linecap="round" stroke-dasharray="226 283"/>
    <line x1="0" y1="40" x2="52" y2="-24" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="40" r="10" fill="#f8fafc"/>
    <text x="0" y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="2">TRUST SCORE</text>
  </g>

  <text x="340" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f8fafc" letter-spacing="10">VERITAS</text>
  <text x="344" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Hybrid AI news credibility analyzer</text>
  <text x="344" y="234" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#64748b" letter-spacing="1">LLM agents  |  cross-verification  |  Beta Reputation System</text>
</svg>
